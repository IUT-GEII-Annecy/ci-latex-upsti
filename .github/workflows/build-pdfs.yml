name: Compile et publie les PDF (workflow réutilisable)

# Reusable workflow (workflow_call) : factorise TOUT le pipeline de
# compilation/publication (checkout, installation d'UPSTI, gitinfo2,
# compilation, index HTML, publication GitHub Pages), y compris les
# scripts scripts/build_pdfs.sh et scripts/gen_index.py de CE dépôt
# (checkoutés dans le job appelant, voir plus bas) : aucun dépôt appelant
# n'a besoin de garder sa propre copie de ces scripts. Ce qui varie d'un
# dépôt à l'autre (exclusions, titre du site, mode de classement) se
# déclare via les inputs ci-dessous, pas par une copie modifiée.
#
# Usage minimal dans le dépôt appelant
# (.github/workflows/build-pdfs.yml) :
#
#   name: Compile et publie les PDF
#   on:
#     push:
#       branches: [main, master]
#     workflow_dispatch: {}
#   jobs:
#     publish:
#       uses: IUT-GEII-Annecy/ci-latex-upsti/.github/workflows/build-pdfs.yml@main
#       with:
#         site-title: "Supports Informatique - BUT GEII"
#         site-subtitle: "Tous les supports de cours, TD et TP pour le cours d'informatique Semestre 1 - GEII IUT Annecy"
#         group-label: "Séquence"
#         classify-mode: folder   # ou "documentclass" (défaut)
#         exclude-patterns: |
#           /Evaluations/
#       secrets: inherit
#
# Secret requis côté dépôt appelant (Settings > Secrets and variables >
# Actions) : UPSTI_DEPLOY_KEY (clé de déploiement en lecture vers le
# dépôt privé GeoffreyV/UPSTI). "secrets: inherit" le transmet
# automatiquement, aucune déclaration supplémentaire n'est nécessaire
# côté appelant.
#
# Optionnel -- archives de code pour les solutions de TP (voir marqueurs
# .solution / .solution-prof dans un dossier de TP, indépendants d'un
# corrigé PDF, scripts/gen_index.py) : renseigner l'input solutions-repo
# (ex. "IUT-GEII-Annecy/solutions"). Si ce dépôt est privé, fournir aussi
# le secret SOLUTIONS_DEPLOY_KEY (même mécanisme que UPSTI_DEPLOY_KEY) ;
# s'il est public, ce secret n'est pas nécessaire. Sans solutions-repo, la
# fonctionnalité est simplement inactive. La solution est proposée comme
# commande "wget" à copier (voir marqueur .squelette ci-dessous), pas
# comme lien de téléchargement -- nécessite site-base-url (calculé
# automatiquement par défaut, voir cet input plus bas).
#
# Optionnel -- commande wget du squelette de TP (marqueur .squelette
# contenant l'URL complète à télécharger, scripts/build_pdfs.sh) :
# n'importe quel dossier peut le déposer, aucun input requis. Affiche un
# bouton "copier la commande" à côté de "Sujet", toujours public.
#
# Optionnel -- aperçu enseignant des corrections/solutions (marqueurs
# .corrige-prof / .solution-prof, voir scripts/build_pdfs.sh et
# scripts/gen_index.py) : ne nécessite aucun input/secret, toujours actif.
# Publie une page à part, non listée et non indexable (_site/prof-preview/,
# meta robots + robots.txt), jamais liée depuis la page publique -- ce
# n'est PAS un vrai contrôle d'accès, juste un lien à ne pas partager aux
# étudiants.
#
# Prérequis GitHub une fois par dépôt appelant :
#   - Settings > Pages > Source = "GitHub Actions"
#   - Le package ghcr.io/iut-geii-annecy/texlive-upsti doit autoriser ce
#     dépôt (Manage Actions access sur la page du package), ou être public.
#
# Voir scripts/gen_index.py (docstring) pour le détail des deux modes de
# classement ("documentclass" / "folder") et scripts/build_pdfs.sh pour
# le format de "exclude-patterns" (un motif grep -E par ligne, appliqué
# en plus des exclusions communes .eval/.hide/.old).

on:
  workflow_call:
    inputs:
      site-dir:
        description: "Dossier de sortie contenant le site à publier sur Pages"
        type: string
        default: _site
      texlive-image:
        description: "Image Docker TeX Live/UPSTI à utiliser pour la compilation"
        type: string
        default: ghcr.io/iut-geii-annecy/texlive-upsti:latest
      fetch-depth:
        description: "Profondeur d'historique récupérée (utile pour dater les documents via git log)"
        type: number
        default: 100
      exclude-patterns:
        description: "Motifs grep -E supplémentaires (un par ligne) de chemins à ne jamais publier, en plus de .eval/.hide/.old"
        type: string
        default: ""
      site-title:
        description: "Titre du site (balise <title> et <h1>)"
        type: string
        default: "Supports pédagogiques - BUT GEII"
      site-subtitle:
        description: "Sous-titre affiché sous le titre"
        type: string
        default: "Tous les supports de cours, TD et TP - GEII IUT Annecy"
      group-label:
        description: "Intitulé de la colonne de regroupement du tableau (ex. \"Séquence\" ou \"Module\")"
        type: string
        default: "Séquence"
      classify-mode:
        description: "\"documentclass\" (classement par option de \\documentclass, regroupement par dossier de premier niveau) ou \"folder\" (classement par nom de dossier td*/tp*/c\\d, regroupement par second segment du chemin)"
        type: string
        default: documentclass
      ci-repo-ref:
        description: "Réf (branche/tag/sha) de ce dépôt à checkouter pour récupérer les scripts -- utile pour figer une version au lieu de @main"
        type: string
        default: main
      enable-tp-downloads:
        description: "Active les scripts de démarrage/solutions de TP en commande à copier (voir marqueurs script_demarrage, .solution, .solution-prof). Spécifique aux dépôts dont les étudiants travaillent en IDE cs50 (ex. supports-informatique) -- désactivé par défaut pour tous les autres dépôts partageant ce workflow."
        type: boolean
        default: false
      solutions-repo:
        description: "Dépôt GitHub (org/repo) contenant les archives de code des solutions de TP (voir marqueurs .solution/.solution-prof). Vide = fonctionnalité désactivée. Sans effet si enable-tp-downloads est false."
        type: string
        default: ""
      solutions-repo-ref:
        description: "Branche/tag/sha de solutions-repo à checkouter. Volontairement explicite (jamais laissé vide) : sans ref, actions/checkout résout le nom de la branche par défaut via l'API REST GitHub avec le token ambiant (pas la clé SSH) -- pour un dépôt privé auquel ce token n'a pas accès, cet appel échoue en 404 avant même que la clé de déploiement ne serve à quoi que ce soit."
        type: string
        default: main
      site-base-url:
        description: "URL publique de base du site (sans / final), nécessaire pour générer une commande wget absolue pour la solution de TP. Vide = calculée automatiquement (https://<owner>.github.io/<repo>) ; à renseigner explicitement seulement avec un domaine personnalisé (CNAME)."
        type: string
        default: ""
      incremental-build:
        description: "Ne recompile un document que si un commit a touché son dossier depuis la dernière compilation réussie (comparaison sur le hash du dernier commit, jamais une date -- voir scripts/build_pdfs.sh). Invalidé en bloc si UPSTI, ce dépôt de scripts, ou un fichier preamble*.tex/*.cls/*.sty a changé. Persisté entre runs via actions/cache."
        type: boolean
        default: true
      force-full-rebuild:
        description: "Ignore le cache de compilation incrémentale pour ce run et recompile tout, sans l'invalider pour les runs suivants. À relier à un input workflow_dispatch côté dépôt appelant pour un déclenchement manuel."
        type: boolean
        default: false
    secrets:
      UPSTI_DEPLOY_KEY:
        description: "Clé de déploiement (lecture) vers le dépôt privé GeoffreyV/UPSTI"
        required: true
      SOLUTIONS_DEPLOY_KEY:
        description: "Clé de déploiement (lecture) vers solutions-repo, si ce dépôt est privé. Inutile si solutions-repo est vide ou public."
        required: false

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.texlive-image }}
    steps:
      - name: Checkout du dépôt appelant
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Générer les métadonnées gitinfo2 (.git/gitHeadInfo.gin)
        # gitinfo2 obtient normalement ces métadonnées via un hook git
        # local (post-commit/post-checkout/post-merge, installé
        # manuellement dans .git/hooks/ -- non versionné par git, donc
        # absent après un clone frais comme celui d'actions/checkout).
        # On reproduit ici exactement la même commande que le hook
        # (post-xxx-sample.txt du paquet gitinfo2).
        run: |
          # Le job tourne dans un conteneur Docker : le dépôt cloné par
          # actions/checkout appartient souvent à un UID différent de celui
          # qui exécute ce step, ce que git refuse par défaut ("detected
          # dubious ownership in repository"), avec un exit code 128 dès la
          # première commande git ci-dessous.
          git config --global --add safe.directory '*'
          # || true : sous "sh -e" (shell par défaut en conteneur), tout
          # exit non nul interromprait immédiatement le script -- même si
          # $(...) capture déjà la sortie de secours de --always.
          FIRSTTAG=$(git describe --tags --always --dirty='-*' 2>/dev/null || true)
          RELTAG=$(git describe --tags --long --always --dirty='-*' --match '[0-9]*.*' 2>/dev/null || true)
          git --no-pager log -1 --date=short --decorate=short \
            --pretty=format:"\usepackage[%
          shash={%h},
          lhash={%H},
          authname={%an},
          authemail={%ae},
          authsdate={%ad},
          authidate={%ai},
          authudate={%at},
          commname={%cn},
          commemail={%ce},
          commsdate={%cd},
          commidate={%ci},
          commudate={%ct},
          refnames={%d},
          firsttagdescribe={$FIRSTTAG},
          reltag={$RELTAG}
          ]{gitexinfo}" HEAD > .git/gitHeadInfo.gin

      - name: Checkout du package LaTeX UPSTI (privé)
        # ref explicite : sans lui, actions/checkout résout la branche par
        # défaut via l'API REST GitHub avec le token ambiant (pas la clé
        # SSH) -- pour un dépôt privé auquel ce token n'a pas accès, cet
        # appel échoue en 404 avant même que la clé de déploiement ne
        # serve à quoi que ce soit (voir le même correctif sur le checkout
        # solutions ci-dessous, où l'erreur a été observée en conditions
        # réelles).
        uses: actions/checkout@v7
        with:
          repository: GeoffreyV/UPSTI
          ref: master
          ssh-key: ${{ secrets.UPSTI_DEPLOY_KEY }}
          path: _upsti-src

      - name: Capturer le commit UPSTI (avant nettoyage de _upsti-src)
        # Sert à invalider en bloc le cache de compilation incrémentale si
        # UPSTI change (voir scripts/build_pdfs.sh) -- capturé ici car
        # _upsti-src est supprimé juste après par le step suivant.
        # safe.directory a déjà été configuré globalement par le step
        # gitinfo2 ci-dessus, inutile de le refaire.
        run: echo "UPSTI_SHA=$(git -C _upsti-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Installer UPSTI dans l'arborescence TEXMF personnelle
        run: |
          mkdir -p "$HOME/texmf/tex/latex"
          cp -r _upsti-src "$HOME/texmf/tex/latex/UPSTI"
          rm -rf _upsti-src

      - name: Indexer UPSTI dans TeX Live (texhash)
        run: texhash "$HOME/texmf"

      - name: Checkout des scripts communs (ci-latex-upsti)
        uses: actions/checkout@v7
        with:
          repository: IUT-GEII-Annecy/ci-latex-upsti
          ref: ${{ inputs.ci-repo-ref }}
          path: _ci-common

      - name: Capturer le commit ci-latex-upsti
        # Même rôle que la capture UPSTI ci-dessus : si les scripts
        # communs changent, le cache de compilation incrémentale est
        # invalidé en bloc plutôt que de risquer de publier du contenu
        # généré par une version obsolète du script.
        run: echo "CI_COMMON_SHA=$(git -C _ci-common rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restaurer le cache de compilation incrémentale
        # Toujours sauvegardé en fin de job sous la clé exacte (incluant
        # github.sha) si son contenu a changé ; restauré au run suivant via
        # restore-keys (préfixe) puisque la clé exacte, unique à CE commit,
        # n'a par construction encore jamais été écrite. build_pdfs.sh
        # (voir GLOBAL_DEPS_HASH) reste seul juge de ce qui, dans ce cache,
        # est effectivement réutilisable pour ce run.
        if: ${{ inputs.incremental-build }}
        uses: actions/cache@v6
        with:
          path: .build-cache
          key: build-cache-${{ github.sha }}
          restore-keys: |
            build-cache-

      - name: Checkout du dépôt solutions (optionnel)
        # N'a lieu que si enable-tp-downloads est actif ET solutions-repo
        # renseigné (voir marqueurs .solution/.solution-prof dans
        # scripts/build_pdfs.sh) ; sans ce step, le dossier _solutions-src
        # n'existe pas et la fonctionnalité est ignorée.
        if: ${{ inputs.enable-tp-downloads && inputs.solutions-repo != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.solutions-repo }}
          ref: ${{ inputs.solutions-repo-ref }}
          ssh-key: ${{ secrets.SOLUTIONS_DEPLOY_KEY }}
          path: _solutions-src

      - name: Compiler les documents publiables
        env:
          CI_EXCLUDE_PATTERNS: ${{ inputs.exclude-patterns }}
          SITE_TITLE: ${{ inputs.site-title }}
          SITE_SUBTITLE: ${{ inputs.site-subtitle }}
          GROUP_LABEL: ${{ inputs.group-label }}
          CLASSIFY_MODE: ${{ inputs.classify-mode }}
          ENABLE_TP_DOWNLOADS: ${{ inputs.enable-tp-downloads }}
          SOLUTIONS_SRC: _solutions-src
          SITE_BASE_URL: ${{ inputs.site-base-url != '' && inputs.site-base-url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          INCREMENTAL_BUILD: ${{ inputs.incremental-build }}
          FORCE_FULL_REBUILD: ${{ inputs.force-full-rebuild }}
          UPSTI_SHA: ${{ env.UPSTI_SHA }}
          CI_COMMON_SHA: ${{ env.CI_COMMON_SHA }}
        run: bash _ci-common/scripts/build_pdfs.sh "${{ inputs.site-dir }}"

      - name: Upload de l'artefact Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.site-dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
